      <button class="button">button</button>

      <div class="app">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
          <button class="sidebar-toggle">
            <svg class="sidebar-toggle__icon">
              <use href="#arrow-symbol"></use>
            </svg>
          </button>
          <div class="sidebar-header"></div>

          <div class="period-section">
            <span class="period-label">📅 PERIOD</span>
            <select class="period-select period-select_month">
              <option value="January">January</option>
              <option value="February">February</option>
              <option value="March">March</option>
              <option value="April">April</option>
              <option value="May" selected>May</option>
              <option value="June">June</option>
              <option value="July">July</option>
              <option value="August">August</option>
              <option value="September">September</option>
              <option value="October">October</option>
              <option value="November">November</option>
              <option value="December">December</option>
            </select>
            <select class="period-select period-select_year">
              <option value="2025">2025</option>
              <option value="2026" selected>2026</option>
              <option value="2027">2027</option>
            </select>
          </div>

          <div class="nav-menu">
            <div class="nav-item active" data-tab="projects">
              <span class="nav-icon">📊</span>
              <span class="nav-text">Projects</span>
            </div>
            <div class="nav-item" data-tab="employees">
              <span class="nav-icon">👥</span>
              <span class="nav-text">Employees</span>
            </div>
          </div>

          <div class="sidebar-footer">
            <button class="seed-btn" id="seedDataBtn">🌱 <span>Seed Data</span></button>
          </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
          <!-- Projects Panel -->
          <div class="view-panel view-panel_project active">
            <div class="card">
              <div class="card-header">
                <h2>📁 Projects</h2>
                <button class="btn-primary btn-primary_project">+ Add Project</button>
              </div>
              <div class="table-wrapper">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Company&nbsp;Name</th>
                      <th>Project&nbsp;Name</th>
                      <th>Budget</th>
                      <th>Employee&nbsp;Capacity</th>
                      <th>Estimated&nbsp;Income</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody class="table-body table-body_projects"></tbody>
                </table>
              </div>
              <div class="total-income"></div>
            </div>
          </div>

          <!-- Employees Panel -->
          <div class="view-panel view-panel_employee">
            <div class="card">
              <div class="card-header">
                <h2>👥 Employees</h2>
                <button class="btn-primary btn-primary_employee">+ Add Employee</button>
              </div>
              <div class="table-wrapper">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Surname</th>
                      <th>Age</th>
                      <th>Position</th>
                      <th>Salary</th>
                      <th>Estimated&nbsp;Payment</th>
                      <th>Project</th>
                      <th>Projected&nbsp;Income</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody class="table-body table-body_employees"></tbody>
                </table>
              </div>
              <div class="total-income"></div>
            </div>
          </div>
        </div>
